name: guitar-tabs-local
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.docker
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/001-base.sql:/docker-entrypoint-initdb.d/001-base.sql:ro
      - ./docs/sql/add-tab-characteristics.sql:/docker-entrypoint-initdb.d/002-characteristics.sql:ro
      - ./docs/sql/add-customer-auth.sql:/docker-entrypoint-initdb.d/003-auth.sql:ro
      - ./docs/sql/allow-telegram-users-without-email.sql:/docker-entrypoint-initdb.d/004-telegram.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
